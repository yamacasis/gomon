telegram:
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"
  api_url: "https://api.telegram.org"   # change to your proxy URL if needed
  socks_proxy: ""                        # e.g. socks5://user:pass@host:1080

webhook:
  url: ""                               # leave empty to disable
  headers:
    # Authorization: "Bearer YOUR_TOKEN"

heartbeat:
  time: "08:00"

log_file: "monitor.log"

websites:
  - url: "https://example.com"
    interval: 30s
    timeout: 15s
    attempts: 3               # retry transient failures within one check
    retry_delay: 1s
    failure_threshold: 2      # alert after 2 failed checks in a row
    recovery_threshold: 2     # recover after 2 successful checks in a row
    ssl: true
    ssl_min_days: 30

  - url: "https://api.example.com:8443"
    interval: 1m
    ssl: true
    ssl_min_days: 14

  - url: "http://internal.example.com:8080"
    interval: 5m
    ssl: false
