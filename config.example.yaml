telegram:
  name: "default-telegram"
  tags: ["general"]
  bot_token: "YOUR_BOT_TOKEN_HERE"
  chat_id: "YOUR_CHAT_ID_HERE"
  api_url: "https://api.telegram.org"   # change to your proxy URL if needed
  socks_proxy: ""                        # e.g. socks5://user:pass@host:1080

# Optional Bale messenger bot. chat_id may be a user, group, or channel ID.
bale:
  name: "default-bale"
  tags: ["general"]
  bot_token: ""
  chat_id: ""
  api_url: "https://tapi.bale.ai"

# Additional routed outputs. An alert is delivered when any channel tag matches
# any tag on the website or prometheus target that generated it.
# telegram_channels:
#   - name: "infrastructure-team"
#     tags: ["infra", "critical"]
#     bot_token: "ANOTHER_TELEGRAM_BOT_TOKEN"
#     chat_id: "ANOTHER_TELEGRAM_CHAT_ID"
# bale_channels:
#   - name: "website-team"
#     tags: ["web"]
#     bot_token: "ANOTHER_BALE_BOT_TOKEN"
#     chat_id: "ANOTHER_BALE_CHAT_ID"

webhook:
  url: ""                               # leave empty to disable
  headers:
    # Authorization: "Bearer YOUR_TOKEN"

# Alerts are written to queue_file before delivery. Failed sends are retried
# with exponential backoff and each final channel result is appended as JSONL.
notifications:
  queue_file: "notification-queue.json"
  delivery_log: "notification-deliveries.log"
  timeout: 15s
  initial_retry: 5s
  max_retry: 5m
  max_attempts: 10

heartbeat:
  time: "08:00"

# Set port to 0 or omit this block to disable the Prometheus endpoint.
metrics:
  port: 9091
  listen_address: "0.0.0.0"

log_file: "monitor.log"

websites:
  - url: "https://example.com"
    tags: ["general"]
    cloudflare: true          # ignore no-response network failures; HTTP errors still alert
    interval: 30s
    timeout: 15s
    attempts: 3               # retry transient failures within one check
    retry_delay: 1s
    failure_threshold: 2      # alert after 2 failed checks in a row
    recovery_threshold: 2     # recover after 2 successful checks in a row
    ssl: true
    ssl_min_days: 30

  - url: "https://api.example.com:8443"
    # API checks can use any HTTP method, headers/body, exact status codes,
    # body assertions, and dot-separated JSON paths (array indexes are numeric).
    method: POST
    headers:
      X-Tenant: "production"
    bearer_token: "YOUR_API_TOKEN"
    body: '{"probe":true}'
    expected_status: 200
    response_type: json
    response_contains: ["healthy"]
    response_not_contains: ["maintenance"]
    json_assertions:
      status: "ok"
      data.ready: true
    interval: 1m
    ssl: true
    ssl_min_days: 14

  - url: "http://internal.example.com:8080"
    interval: 5m
    ssl: false

prometheus_targets:
  - name: "server-01"
    tags: ["general"]
    url: "http://10.0.0.10:9100/metrics"
    type: "node_exporter"
    interval: 1m
    timeout: 10s
    failure_threshold: 2
    recovery_threshold: 2
    basic_auth:
      username: "admin"
      password: "CHANGE_ME"
    headers:
      # Authorization: "Bearer YOUR_TOKEN"
    thresholds:
      cpu_percent: 90
      ram_percent: 90
      disk_percent: 90
      disk_io_percent: 95
      load_per_cpu: 2
      temperature_celsius: 85
